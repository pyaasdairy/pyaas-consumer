<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pyaas — Play Compliance Tracker</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#0e1014; --panel:#171a20; --panel2:#1d2129; --line:#282d37;
  --fg:#e9ebef; --mut:#98a0ad; --acc:#7cb3ff;
  --blocker:#ff6b6b; --high:#ffb057; --medium:#ffe06b; --low:#8fa3b8; --done:#5ed39a;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f7f8fa;--panel:#fff;--panel2:#f1f3f6;--line:#e2e5ea;--fg:#14171c;--mut:#5c6470;--acc:#1a68d1}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--bg);
 border-bottom:1px solid var(--line);padding:20px 28px 14px}
h1{font-size:20px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:13px}
.wrap{max-width:1180px;margin:0 auto}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;
 padding:11px 15px;min-width:104px}
.kpi b{display:block;font-size:23px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:var(--done);transition:width .35s ease}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:4px}
input[type=search]{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);
 color:var(--fg);border-radius:9px;padding:8px 12px;font:inherit}
select,button{background:var(--panel);border:1px solid var(--line);color:var(--fg);
 border-radius:9px;padding:8px 11px;font:inherit;cursor:pointer}
button:hover,select:hover{border-color:var(--acc)}
main{max-width:1180px;margin:0 auto;padding:18px 28px 80px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);
 margin:26px 0 10px;font-weight:600}
.item{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);
 border-left:4px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px}
.item.blocker{border-left-color:var(--blocker)}
.item.high{border-left-color:var(--high)}
.item.medium{border-left-color:var(--medium)}
.item.low{border-left-color:var(--low)}
.item.done{opacity:.5;border-left-color:var(--done)}
.item.done .txt{text-decoration:line-through}
.cb{appearance:none;width:20px;height:20px;min-width:20px;margin-top:2px;border:1.6px solid var(--line);
 border-radius:6px;cursor:pointer;position:relative;background:var(--panel2)}
.cb:checked{background:var(--done);border-color:var(--done)}
.cb:checked::after{content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;
 border:solid #06281a;border-width:0 2.4px 2.4px 0;transform:rotate(42deg)}
.body{flex:1;min-width:0}
.idrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:650}
.tag{font-size:10.5px;color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:1px 7px}
.tag.auto{color:var(--acc);border-color:var(--acc)}
.tag.sev{text-transform:uppercase;letter-spacing:.04em}
.txt{font-size:14px}
.txt code{background:var(--panel2);padding:1px 5px;border-radius:5px;font-size:12.5px}
details{margin-top:7px}
summary{cursor:pointer;color:var(--mut);font-size:12.5px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
pre{background:var(--panel2);padding:10px 12px;border-radius:8px;overflow:auto;
 font-size:12px;margin:8px 0 0;white-space:pre-wrap}
.refs a{color:var(--acc);font-size:12px;display:block;margin-top:4px;word-break:break-all}
.empty{color:var(--mut);padding:40px;text-align:center}
textarea{width:100%;height:120px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
 border-radius:9px;padding:10px;font:12px ui-monospace,monospace;margin-top:8px}
.note{color:var(--mut);font-size:12px;margin-top:8px}
</style></head>
<body>
<header><div class="wrap">
  <h1>Pyaas — Google Play Compliance Tracker</h1>
  <div class="sub">178 checks · resubmission gate after a User Data / Prominent Disclosure takedown · compiled 17 Aug 2026</div>
  <div class="kpis" id="kpis"></div>
  <div class="bar"><i id="bar" style="width:0%"></i></div>
  <div class="ctrls">
    <input type="search" id="q" placeholder="Search checks, e.g. phone, contacts, targetSdk, UPI…">
    <select id="fsec"><option value="">All sections</option></select>
    <select id="fsev"><option value="">All severities</option>
      <option value="blocker">Blocker</option><option value="high">High</option>
      <option value="medium">Medium</option><option value="low">Low</option></select>
    <select id="fst"><option value="">All statuses</option>
      <option value="open">Open</option><option value="done">Done</option></select>
    <select id="fkind"><option value="">All kinds</option>
      <option value="auto">Scanner-enforced</option><option value="attest">Human sign-off</option></select>
    <button id="expand">Expand fixes</button>
    <button id="save">Export progress</button>
    <button id="reset">Reset</button>
  </div>
</div></header>
<main><div id="list"></div>
  <details id="io"><summary>Import / export progress (paste JSON here)</summary>
    <textarea id="iobox" placeholder='{"checked":["INC-001","PERM-002"]}'></textarea>
    <button id="load">Load pasted progress</button>
    <div class="note">Progress lives in this page only — export before closing if you want to keep it.</div>
  </details>
</main>
<script>
const ITEMS = [{"id": "INC-001", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "A Prominent Disclosure (PD) screen is displayed **before** any code path that reads, derives, or transmits a phone number — including `TelephonyManager.getLine1Number()`, `SubscriptionManager`, SIM/ICCID reads, autofill hints, or a phone number typed by the user that is sent to your backend for OTP.", "sev": "blocker", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "Wrap every phone-number code path:\n  await ConsentGate.require(context, ConsentScope.phoneNumber);\nConsentGate.require() must (a) return immediately if consent v1 is stored,\n(b) otherwise push the blocking PD route and only return true on Agree.\nNever call the OTP API before that returns true.\n", "refs": ["Play User Data policy — Prominent Disclosure & Consent", "https://support.google.com/googleplay/android-developer/answer/11150561"], "scanner": true}, {"id": "INC-002", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "The PD is a **dedicated, blocking screen or modal**, not a toast, snackbar, banner, bottom-sheet that dismisses on outside-tap, or a line inside your ToS/onboarding carousel.", "sev": "blocker", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "Use a full-screen route (MaterialPageRoute) or\nshowDialog(barrierDismissible: false, ...) wrapped in\nPopScope(canPop: false). Delete any toast/snackbar-based disclosure.\n", "refs": ["Play User Data policy — consent cannot be inferred from navigation away"], "scanner": true}, {"id": "INC-003", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "The PD is reachable in **normal app usage** on first launch — not behind Settings, a \"Privacy\" menu, an \"i\" icon, or a \"Learn more\" link.", "sev": "blocker", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "Route the PD from the first-run/auth flow itself, before the OTP screen.\nSettings may contain a *revocation* control, but must not be the only\nplace the disclosure is presented.\n", "refs": ["Play User Data policy — must not require navigating into a menu or settings"], "scanner": true}, {"id": "INC-004", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "The PD text follows the recommended pattern: *\"Pyaas collects and transmits your phone number to create and secure your account and to send you one-time verification codes, when you sign in or sign up.\"* — i.e. **what data → what feature → in what scenario**.", "sev": "blocker", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "INC-005", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "Consent requires **affirmative action**: an explicit `Agree`/`Continue` button, or a ticked checkbox. Not `Got it`, not `OK`, not `Allow access` (Google explicitly calls out `Got it` and system-UI-mimicking wording as mistakes).", "sev": "blocker", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "Rename the primary CTA to \"I agree\" or \"Agree and continue\".\n\"Got it\" and \"OK\" do not constitute affirmative consent; \"Allow access\"\nmimics the Android system prompt and is called out as a mistake.\n", "refs": ["Play best practices — avoid 'Got it', avoid 'Allow access', avoid system-UI mimicry"], "scanner": true}, {"id": "INC-006", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "A **visible decline path** exists (`Not now` / `Cancel` / `Decline`) with at least two options rendered.", "sev": "blocker", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "Render two buttons of comparable prominence. The decline path must return\nthe user to a usable state, not exit the app silently.\n", "refs": ["Play best practices — provide at least two options, one to decline"], "scanner": true}, {"id": "INC-007", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "Back-press, tap-outside, home-press, and swipe-dismiss are **not** treated as consent. `PopScope(canPop: false)` / `barrierDismissible: false` / no `Navigator.pop` on barrier tap.", "sev": "blocker", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "Wrap the PD widget:\n  PopScope(canPop: false, child: ...)\nand ensure the consent flag is written ONLY inside the Agree handler.\n", "refs": ["Play User Data policy — navigation away, back or home must not imply consent"], "scanner": true}, {"id": "INC-008", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "The PD does **not** auto-dismiss. No `Timer`, `Future.delayed`, `SnackBar(duration:)`, or animation-driven dismissal wraps the consent surface.", "sev": "blocker", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "Remove any timed dismissal from disclosure widgets.", "refs": ["Play User Data policy — no auto-dismissing or expiring messages"], "scanner": true}, {"id": "INC-009", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "Consent is **persisted and gated**: a `consent.phone_number.v1` flag is written before any phone-number network call, and every such call is wrapped by a guard that reads it.", "sev": "blocker", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "Store consent as `consent.<scope>.v<N>` with the timestamp, app version,\nlocale and policy version. Bump N whenever the disclosed scope changes;\na bumped version must re-prompt.\n", "refs": [], "scanner": true}, {"id": "INC-010", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "The PD contains **only** personal/sensitive-data disclosure. No marketing consent, no newsletter opt-in, no \"accept ToS\", no referral prompt bundled into the same surface (policy: *\"cannot be included with other disclosures unrelated to personal and sensitive user data collection\"*).", "sev": "blocker", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "Split the surface. ToS acceptance, marketing opt-in and referral prompts\nmust live on separate screens from the data-collection disclosure.\n", "refs": ["Play User Data policy — cannot be included with other unrelated disclosures"], "scanner": true}, {"id": "INC-011", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "No phone number, SIM identifier, IMEI/IMSI/ICCID, Android ID, or advertising ID is transmitted **before** consent — including to analytics/crash SDKs auto-initialised at app start. Verify with a proxy capture.", "sev": "high", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "In AndroidManifest.xml:\n  <meta-data android:name=\"firebase_analytics_collection_enabled\" android:value=\"false\" />\n  <meta-data android:name=\"google_analytics_default_allow_ad_personalization_signals\" android:value=\"false\" />\nEnable analytics only after ConsentGate returns true.\n", "refs": [], "scanner": true}, {"id": "INC-012", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "Declining consent **gracefully degrades** — the user can still browse/use non-account features. Hard-blocking the whole app on a PD is permitted only if account creation is genuinely the sole function; document the justification.", "sev": "high", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "INC-013", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "The PD is shown in **every locale** you ship, translated. An English-only PD in a Hindi/regional UI is treated as no disclosure.", "sev": "blocker", "auto": false, "attest": true, "domain": "prominent_disclosure", "fix": "Add the missing keys to every ARB file under lib/l10n/.", "refs": [], "scanner": true}, {"id": "INC-014", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "The PD is present in **every release track** — Production, Open, Closed, Internal. Google's notice explicitly requires the fix in all tracks.", "sev": "blocker", "auto": false, "attest": true, "domain": "operations", "fix": "In Play Console update Production, Open, Closed and Internal tracks.\nGoogle's notice explicitly requires non-production tracks to be fixed too.\n", "refs": [], "scanner": true}, {"id": "INC-015", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "The non-compliant version is moved to **\"Not included\"** in the new release, and the old version is **deactivated**. Version code incremented.", "sev": "blocker", "auto": false, "attest": true, "domain": "operations", "fix": "Create a new release, move the suspended version code into the\n\"Not included\" section, and deactivate it.\n", "refs": [], "scanner": true}, {"id": "INC-016", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "A screen recording (`.mp4`, ≤50 MB) of the full first-run PD flow on a clean install is attached to the appeal/declaration.", "sev": "high", "auto": false, "attest": true, "domain": "operations", "fix": "Record a clean-install first-run walkthrough and link it in the appeal.", "refs": [], "scanner": true}, {"id": "INC-017", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "Data Safety form updated: `Phone number` → **Collected = Yes**, purposes = *Account management, App functionality, Fraud prevention/security*, `Required` (not optional) if OTP is mandatory, encrypted in transit = Yes.", "sev": "high", "auto": false, "attest": true, "domain": "data_safety", "fix": "In data_safety.yaml set:\n  phone_number: {collected: true, shared: false, required: true,\n                 purposes: [account_management, app_functionality, fraud_prevention],\n                 encrypted_in_transit: true, deletable: true}\nMirror it exactly in the Play Console Data safety form.\n", "refs": [], "scanner": true}, {"id": "INC-018", "section": "SECTION 0 — INCIDENT-SPECIFIC REMEDIATION (your actual takedown)", "text": "Privacy policy updated with the same phone-number language, timestamped, live at a public non-geofenced HTTPS URL, and linked both in Play Console **and** in-app.", "sev": "medium", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PD-100", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "sev": "high", "text": "<b>Phone number / SIM</b> — trigger: Before OTP send, SIM read, or number autofill upload. Disclosure must state: data + purpose + scenario + who it is shared with", "auto": false, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PD-101", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "sev": "high", "text": "<b>Contacts</b> — trigger: Before `READ_CONTACTS` request **or** before any contact upload. Disclosure must state: must state whether contacts leave the device", "auto": false, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PD-102", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "sev": "high", "text": "<b>Precise location</b> — trigger: Before `ACCESS_FINE_LOCATION`. Disclosure must state: why coarse is insufficient", "auto": false, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PD-103", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "sev": "high", "text": "<b>Background location</b> — trigger: Before `ACCESS_BACKGROUND_LOCATION` — **separate, second** disclosure. Disclosure must state: must state collection happens when app is closed", "auto": false, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PD-104", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "sev": "high", "text": "<b>Camera</b> — trigger: Before `CAMERA`. Disclosure must state: whether images are uploaded/retained", "auto": false, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PD-105", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "sev": "high", "text": "<b>Photos/video library</b> — trigger: Before `READ_MEDIA_IMAGES`/`READ_MEDIA_VIDEO`. Disclosure must state: only if Photo Picker is genuinely insufficient", "auto": false, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PD-106", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "sev": "high", "text": "<b>Payment/financial info</b> — trigger: Before collecting card/UPI/bank identifiers. Disclosure must state: who processes, retention, PCI/PA-DSS posture", "auto": false, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PD-107", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "sev": "high", "text": "<b>Device/advertising ID</b> — trigger: Before analytics/ads SDK init. Disclosure must state: linkage to other personal data", "auto": false, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PD-108", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "sev": "high", "text": "<b>Microphone</b> — trigger: Before `RECORD_AUDIO`. Disclosure must state: continuous vs on-demand", "auto": false, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PD-109", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "sev": "high", "text": "<b>Installed apps</b> — trigger: Before `QUERY_ALL_PACKAGES`. Disclosure must state: almost never justifiable — prefer removal", "auto": false, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PD-110", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "sev": "high", "text": "<b>Health/fitness</b> — trigger: Before Health Connect read. Disclosure must state: approved use case only", "auto": false, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PD-001", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "text": "PD renders **before** the OS runtime permission dialog, never after, never \"explaining\" a denial.", "sev": "blocker", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "In each permission helper:\n  if (!await ConsentGate.require(context, scope)) return false;\n  final status = await Permission.x.request();\n", "refs": [], "scanner": true}, {"id": "PD-002", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "text": "PD is not styled to imitate Android System UI (no fake system-dialog chrome, no Android robot iconography, no \"Allow\"/\"Deny\" pair that mimics the OS prompt).", "sev": "blocker", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "Use your own brand styling and wording; never mirror the system prompt.", "refs": [], "scanner": true}, {"id": "PD-003", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "text": "Reading level ≤ 13-year-old. Run the bundled Flesch-Kincaid check on PD strings; fail above grade 8.", "sev": "high", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "Shorten sentences, drop legalese, use active voice.", "refs": [], "scanner": true}, {"id": "PD-004", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "text": "PD strings live in ARB/localisation files, not hardcoded, so translation coverage is verifiable.", "sev": "high", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "Move long literals into ARB files and reference via AppLocalizations.", "refs": [], "scanner": true}, {"id": "PD-005", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "text": "Consent state is versioned (`v1`, `v2`…). Changing what you collect **invalidates** prior consent and must re-prompt.", "sev": "blocker", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PD-006", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "text": "Consent revocation exists in Settings and, when revoked, stops collection and triggers server-side deletion.", "sev": "high", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "Provide Settings → Privacy → \"Manage data permissions\" listing each scope\nwith a toggle. Revocation must stop collection and trigger deletion.\n", "refs": [], "scanner": true}, {"id": "PD-007", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "text": "Consent events are logged locally + server-side with timestamp, app version, policy version, and locale (evidence for appeals and for DPDP §6 record-keeping).", "sev": "medium", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "Persist a ConsentRecord and mirror it server-side (DPDP record-keeping).", "refs": [], "scanner": true}, {"id": "PD-008", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "text": "No sensitive-data network call occurs on a code path that can be reached before the consent guard (static call-graph check).", "sev": "blocker", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PD-009", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "text": "Deep links / push-notification entry points also pass through the consent gate; they are the most common bypass.", "sev": "high", "auto": true, "attest": false, "domain": "prominent_disclosure", "fix": "Add a router-level redirect that forces the PD when consent is missing.", "refs": [], "scanner": true}, {"id": "PD-010", "section": "SECTION 1 — PROMINENT DISCLOSURE ENGINEERING RULES (all sensitive data, not just phone)", "text": "PD is shown on **re-install and on account switch**, not just once per device account.", "sev": "high", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PERM-001", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "Audit `build/app/intermediates/merged_manifests/release/AndroidManifest.xml`, not `android/app/src/main/AndroidManifest.xml`. Every permission there must map to a promoted feature in `permission_justification.yaml`.", "sev": "blocker", "auto": true, "attest": false, "domain": "permissions", "fix": "flutter build apk --release   # generates the merged manifest\nThen list every <uses-permission> in\nbuild/app/intermediates/merged_manifests/release/AndroidManifest.xml\nand add an entry to permission_justification.yaml:\n  android.permission.CAMERA:\n    feature: \"Profile photo capture\"\n    promoted_in_listing: true\n    pd_scope: camera\nRemove unjustified ones with tools:node=\"remove\".\n", "refs": [], "scanner": true}, {"id": "PERM-002", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "No `READ_SMS`, `RECEIVE_SMS`, `SEND_SMS`, `READ_CALL_LOG`, `WRITE_CALL_LOG`, `PROCESS_OUTGOING_CALLS` unless you are the **default SMS/Phone/Assistant handler** and have an approved Play Console declaration.", "sev": "blocker", "auto": true, "attest": false, "domain": "permissions", "fix": "Remove them. For OTP autofill use the SMS Retriever API (zero permissions):\n  dependencies: sms_autofill / smart_auth\nAdd <uses-permission android:name=\"android.permission.READ_SMS\" tools:node=\"remove\" />\nto strip a plugin-injected one.\n", "refs": ["Play SMS and Call Log Permissions policy"], "scanner": true}, {"id": "PERM-003", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "For OTP autofill use **SMS Retriever API** or **SMS User Consent API** — neither needs SMS permissions. Since **July 2026** Play no longer permits account verification via phone call (`READ_CALL_LOG` route is dead); use SMS Retriever or the Digital Credentials API.", "sev": "blocker", "auto": true, "attest": false, "domain": "permissions", "fix": "Migrate to SMS Retriever API or the Digital Credentials API.", "refs": ["Play policy announcement, 15 July 2026 — account verification via phone call no longer permitted"], "scanner": true}, {"id": "PERM-004", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "No `MANAGE_EXTERNAL_STORAGE` (All Files Access) unless core function is file management **and** an approved declaration exists. For a consumer app this is an automatic rejection.", "sev": "blocker", "auto": true, "attest": false, "domain": "permissions", "fix": "Use scoped storage, MediaStore, and the Storage Access Framework.", "refs": [], "scanner": true}, {"id": "PERM-005", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "No legacy `WRITE_EXTERNAL_STORAGE`/`READ_EXTERNAL_STORAGE` without `maxSdkVersion` caps; use scoped storage + MediaStore + SAF.", "sev": "blocker", "auto": true, "attest": false, "domain": "permissions", "fix": "<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"\n                 android:maxSdkVersion=\"28\" />\nor remove entirely.\n", "refs": [], "scanner": true}, {"id": "PERM-006", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "No `QUERY_ALL_PACKAGES` unless an interoperability use case is declared and approved. Prefer `<queries>` element with explicit package/intent filters.", "sev": "blocker", "auto": true, "attest": false, "domain": "permissions", "fix": "Replace with a narrow <queries> block listing specific packages/intents.", "refs": [], "scanner": true}, {"id": "PERM-007", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "No `BIND_ACCESSIBILITY_SERVICE` / accessibility API use in a non-accessibility app. Instant suspension vector for fintech-adjacent apps in India.", "sev": "blocker", "auto": true, "attest": false, "domain": "permissions", "fix": "Remove. Non-accessibility use is an immediate suspension vector in India.", "refs": [], "scanner": true}, {"id": "PERM-008", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "`READ_MEDIA_IMAGES` / `READ_MEDIA_VIDEO`: prefer **Android Photo Picker** (`image_picker` with `PickVisualMedia` / `photo_picker` support). If you keep the broad permission you must file the Photo & Video Permissions declaration and justify why the picker is insufficient. Gallery-manager apps only.", "sev": "high", "auto": true, "attest": false, "domain": "permissions", "fix": "Use image_picker >= 1.x which routes to the Android Photo Picker, or\nPickVisualMedia directly. If you must keep broad access, file the Photo &\nVideo Permissions declaration and justify why the picker is insufficient.\n", "refs": ["Play Photo and Video Permissions policy"], "scanner": true}, {"id": "PERM-009", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "`READ_MEDIA_VISUAL_USER_SELECTED` used for partial access on Android 14+ instead of full-library access.", "sev": "high", "auto": true, "attest": false, "domain": "permissions", "fix": "Declare READ_MEDIA_VISUAL_USER_SELECTED and handle the \"selected photos\" state.", "refs": [], "scanner": true}, {"id": "PERM-010", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "`ACCESS_BACKGROUND_LOCATION` requires a separate PD, a separate runtime request **after** foreground grant, an approved declaration, and a demo video. If your feature works in foreground, remove it.", "sev": "blocker", "auto": true, "attest": false, "domain": "permissions", "fix": "Remove it if the feature works in foreground. Otherwise: separate PD after\nforeground grant, Play Console Location Permissions declaration, and a\nvideo demonstrating the in-app benefit.\n", "refs": [], "scanner": true}, {"id": "PERM-011", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "Prefer `ACCESS_COARSE_LOCATION`. As of the **April 2026** update, the **location button / system location picker is the recommended minimum** for precise-location access — adopt it rather than requesting `ACCESS_FINE_LOCATION` outright.", "sev": "high", "auto": true, "attest": false, "domain": "permissions", "fix": "Adopt the system location button / one-shot picker instead of a raw fine-location request.", "refs": ["Play policy announcement, 15 April 2026 — location button as recommended minimum"], "scanner": true}, {"id": "PERM-012", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "Foreground services: every `FOREGROUND_SERVICE_*` subtype must match a permitted use case, and `foregroundServiceType` must be declared. **Geofencing was removed as an approved FGS use case (April 2026)** — migrate to the Geofence API.", "sev": "blocker", "auto": true, "attest": false, "domain": "permissions", "fix": "Use the Geofence API; never run a foreground service purely for geofencing.", "refs": ["Play policy announcement, 15 April 2026 — geofencing removed as an approved FGS use case"], "scanner": true}, {"id": "PERM-013", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "`SCHEDULE_EXACT_ALARM` / `USE_EXACT_ALARM` only for alarm/calendar-class apps; otherwise use `setInexactRepeating`/WorkManager or request user consent + file the declaration.", "sev": "high", "auto": true, "attest": false, "domain": "permissions", "fix": "Use SCHEDULE_EXACT_ALARM with user consent, or WorkManager/inexact alarms.", "refs": [], "scanner": true}, {"id": "PERM-014", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "`POST_NOTIFICATIONS` requested contextually, not at cold start.", "sev": "high", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PERM-015", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "`USE_FULL_SCREEN_INTENT` only for alarms/calls (Android 14+ auto-grant rules).", "sev": "medium", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PERM-016", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "`READ_CONTACTS`: **from 27 Jan 2027**, apps without a genuine broad-access need must use the **Android Contact Picker**. Migrate now — a picker-based flow removes the permission, the PD burden, and the declaration.", "sev": "blocker", "auto": true, "attest": false, "domain": "permissions", "fix": "Replace full contact reads with the system Contact Picker intent\n(ACTION_PICK on ContactsContract). This removes the permission, the PD\nrequirement and the declaration in one move.\n", "refs": ["Play Permissions policy — Contact Picker requirement effective 27 Jan 2027"], "scanner": true}, {"id": "PERM-017", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "Never link persistent hardware identifiers (IMEI, IMSI, SIM serial, MAC) to other personal data. Do not read them at all outside telephony/EMM use cases.", "sev": "blocker", "auto": true, "attest": false, "domain": "permissions", "fix": "Use an app-scoped resettable identifier (UUID in secure storage) instead.", "refs": [], "scanner": true}, {"id": "PERM-018", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "Advertising ID: manifest must declare `com.google.android.gms.permission.AD_ID` if used, and it must be disclosed in Data Safety. Reset-respecting; never join to a resettable-ID-free identifier.", "sev": "high", "auto": true, "attest": false, "domain": "permissions", "fix": "Declare AD_ID and disclose \"Device or other IDs\" in Data safety.", "refs": [], "scanner": true}, {"id": "PERM-019", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "`REQUEST_INSTALL_PACKAGES` absent unless you legitimately install APKs (you don't) — this triggers Device & Network Abuse review.", "sev": "medium", "auto": true, "attest": false, "domain": "permissions", "fix": "Remove; triggers Device and Network Abuse review.", "refs": [], "scanner": true}, {"id": "PERM-020", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "`SYSTEM_ALERT_WINDOW` absent — overlay permission is heavily scrutinised on Indian fintech apps.", "sev": "medium", "auto": true, "attest": false, "domain": "permissions", "fix": "Remove; overlay permissions are heavily scrutinised on Indian consumer/fintech apps.", "refs": [], "scanner": true}, {"id": "PERM-021", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "No `RECORD_AUDIO`/`CAMERA` left over from a removed feature.", "sev": "high", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PERM-022", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "Every runtime permission has a denial path that does not crash, loop, or re-prompt more than the OS allows.", "sev": "high", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PERM-023", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "`android:usesPermissionFlags=\"neverForLocation\"` set on `BLUETOOTH_SCAN` if Bluetooth is used and location is not derived.", "sev": "medium", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PERM-024", "section": "SECTION 2 — PERMISSIONS & MANIFEST HYGIENE", "text": "`tools:node=\"remove\"` entries added for unwanted plugin-injected permissions, and the merged manifest re-verified after each dependency bump.", "sev": "high", "auto": true, "attest": false, "domain": "permissions", "fix": "Add xmlns:tools and strip plugin-injected permissions you do not use:\n  <uses-permission android:name=\"android.permission.RECORD_AUDIO\" tools:node=\"remove\" />\n", "refs": [], "scanner": true}, {"id": "DS-001", "section": "SECTION 3 — DATA SAFETY FORM ↔ CODE PARITY", "text": "`data_safety.yaml` exists in-repo, is the source of truth, and every declared data type maps to at least one code site; every sensitive code site maps to a declared type. Bidirectional — orphans on either side fail.", "sev": "blocker", "auto": true, "attest": false, "domain": "data_safety", "fix": "For every taxonomy entry whose code_signals appear in the repo, declare it\nin data_safety.yaml. For every declaration with no code signal, remove it\nor document why (server-side collection still counts as collection).\n", "refs": [], "scanner": true}, {"id": "DS-002", "section": "SECTION 3 — DATA SAFETY FORM ↔ CODE PARITY", "text": "Declaration covers **all 13 categories** you touch: Location, Personal info, Financial info, Health & fitness, Messages, Photos & videos, Audio, Files & docs, Calendar, Contacts, App activity, Web browsing, App info & performance, Device or other IDs.", "sev": "blocker", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "DS-003", "section": "SECTION 3 — DATA SAFETY FORM ↔ CODE PARITY", "text": "For each type: **Collected** vs **Shared** answered separately. \"Shared\" includes any transfer to a third party — including your analytics vendor if they may use it for their own purposes.", "sev": "blocker", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "DS-004", "section": "SECTION 3 — DATA SAFETY FORM ↔ CODE PARITY", "text": "\"Optional\" is only claimed when **all users in all regions on all devices** can decline and still use the app. OTP-gated signup ⇒ phone number is **Required**.", "sev": "high", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "DS-005", "section": "SECTION 3 — DATA SAFETY FORM ↔ CODE PARITY", "text": "Ephemeral-processing exemption claimed only where data stays in memory and is not retained. Ad-profile building can never be ephemeral.", "sev": "high", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "DS-006", "section": "SECTION 3 — DATA SAFETY FORM ↔ CODE PARITY", "text": "\"Encrypted in transit = Yes\" is truthful: no cleartext traffic anywhere (see `NET-*`).", "sev": "blocker", "auto": true, "attest": false, "domain": "data_safety", "fix": "Set cleartextTrafficPermitted=\"false\" and remove all http:// endpoints.", "refs": [], "scanner": true}, {"id": "DS-007", "section": "SECTION 3 — DATA SAFETY FORM ↔ CODE PARITY", "text": "\"Users can request data deletion = Yes\" backed by a real, working in-app flow **and** a public web URL.", "sev": "high", "auto": false, "attest": true, "domain": "data_safety", "fix": "", "refs": [], "scanner": true}, {"id": "DS-008", "section": "SECTION 3 — DATA SAFETY FORM ↔ CODE PARITY", "text": "**SDK data collection is included.** You are liable for what Firebase, AdMob, Meta, Branch, AppsFlyer, Razorpay, Clevertap, Sentry, etc. collect. Pull each SDK's published Data Safety mapping and merge it.", "sev": "blocker", "auto": false, "attest": true, "domain": "data_safety", "fix": "For each SDK in pubspec.lock and build.gradle, fetch its published Data\nSafety mapping and merge the data types into data_safety.yaml.\n", "refs": [], "scanner": true}, {"id": "DS-009", "section": "SECTION 3 — DATA SAFETY FORM ↔ CODE PARITY", "text": "Data Safety, privacy policy, and in-app PD text are **mutually consistent** — reviewers diff them. Keep one source string table.", "sev": "high", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "DS-010", "section": "SECTION 3 — DATA SAFETY FORM ↔ CODE PARITY", "text": "Data retention/deletion periods disclosed where retention is required by law (RBI record-keeping, IT Act).", "sev": "medium", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "DS-011", "section": "SECTION 3 — DATA SAFETY FORM ↔ CODE PARITY", "text": "Re-run the parity check on every dependency upgrade; add to CI.", "sev": "medium", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "DS-012", "section": "SECTION 3 — DATA SAFETY FORM ↔ CODE PARITY", "text": "Consider the MASA (Mobile App Security Assessment) independent-review badge — note it does **not** validate Data Safety accuracy, but it helps standing.", "sev": "low", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "LEG-001", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "Privacy policy at a **public, non-geofenced HTTPS URL**, not a PDF, not behind a login, not a Google Doc requiring sign-in. Linked in Play Console **and** in-app.", "sev": "blocker", "auto": true, "attest": false, "domain": "legal", "fix": "Host a plain HTML policy at a stable HTTPS URL; link it in Play Console and in-app.", "refs": [], "scanner": true}, {"id": "LEG-002", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "Policy is titled \"Privacy Policy\", names **Pyaas** and the legal entity, and gives a working privacy contact (email or form).", "sev": "blocker", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "LEG-003", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "Policy enumerates every data type, purpose, sharing recipient, retention period, and security measure — matching Data Safety exactly.", "sev": "blocker", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "LEG-004", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "Account & data deletion instructions appear in the policy, plus the standalone web deletion URL entered in Play Console.", "sev": "high", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "LEG-005", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "**DPDP Act 2023 (India)**: itemised notice at/before collection, in English + the 8th-Schedule languages you serve; clear purpose per data item; consent freely given, specific, informed, unconditional, unambiguous, with a clear affirmative action.", "sev": "high", "auto": false, "attest": true, "domain": "legal", "fix": "Present, at or before collection, an itemised list of the personal data\ncollected and the purpose of each item, with a link to the DPDP rights\npage and the Grievance Officer, available in English plus the regional\nlanguages you serve.\n", "refs": ["Digital Personal Data Protection Act, 2023 (India) — notice & consent"], "scanner": true}, {"id": "LEG-006", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "**DPDP**: withdrawal of consent must be **as easy as giving it** — a one-tap revoke in Settings, not an email request.", "sev": "high", "auto": false, "attest": true, "domain": "legal", "fix": "", "refs": [], "scanner": true}, {"id": "LEG-007", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "**DPDP**: Data Principal rights implemented — access, correction, erasure, grievance redressal, nomination. Publish the **Grievance Officer** name + contact and a response SLA.", "sev": "high", "auto": false, "attest": true, "domain": "legal", "fix": "", "refs": [], "scanner": true}, {"id": "LEG-008", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "**DPDP**: children under 18 — verifiable parental consent required and no behavioural advertising/tracking of children. If Pyaas is 18+, enforce and document an age gate.", "sev": "high", "auto": false, "attest": true, "domain": "legal", "fix": "", "refs": [], "scanner": true}, {"id": "LEG-009", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "**DPDP**: breach notification process to the Data Protection Board and affected principals; documented runbook + contact tree.", "sev": "medium", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "LEG-010", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "**DPDP**: consent-manager readiness and record-keeping — retain consent artefacts (timestamp, version, locale, scope).", "sev": "medium", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "LEG-011", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "**IT Act §43A / SPDI Rules**: \"sensitive personal data\" (passwords, financial info, biometrics) handled with reasonable security practices; ISO 27001-equivalent posture documented.", "sev": "high", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "LEG-012", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "**IT Rules 2021**: grievance officer published in-app; 24h acknowledgement, 15-day resolution norms.", "sev": "medium", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "LEG-013", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "**RBI Digital Lending / payment rules** — if Pyaas facilitates credit, EWA, or holds funds: only regulated-entity partnerships, no direct borrower-app data harvesting, no contacts/photo access for collections (explicitly banned), disclosure of the regulated entity.", "sev": "high", "auto": false, "attest": true, "domain": "legal", "fix": "If Pyaas facilitates credit or EWA: name the regulated entity in-app,\nnever access contacts/photos/location for collections (explicitly banned),\npublish the Key Fact Statement, and file Play's Personal Loans (India)\ndeclaration with proof.\n", "refs": [], "scanner": true}, {"id": "LEG-014", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "**PA/PG rules & UPI**: if you touch payment instruments, confirm your PSP/PA is RBI-authorised, no card storage without tokenisation (CoF tokenisation mandate), no PIN/CVV capture in your UI.", "sev": "high", "auto": false, "attest": true, "domain": "legal", "fix": "Delegate all instrument capture to the RBI-authorised PSP SDK/UPI intent.", "refs": [], "scanner": true}, {"id": "LEG-015", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "**GST/consumer law**: pricing shown inclusive of taxes; refund/cancellation policy reachable in-app.", "sev": "medium", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "LEG-016", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "**GDPR** (if any EU user can install): lawful basis, DPA with processors, SCCs for transfers, DSAR path. Restrict country availability if you don't want this.", "sev": "medium", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "LEG-017", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "Terms of Service separate from Privacy Policy; ToS acceptance is **not** bundled into the PD surface.", "sev": "low", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "LEG-018", "section": "SECTION 4 — PRIVACY POLICY & LEGAL SURFACE (Play + Indian law)", "text": "Trademark/IP: \"Pyaas\" name, icon, and all in-app assets cleared; no third-party marks, no copyrighted music/images without licence.", "sev": "medium", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "NET-001", "section": "SECTION 5 — NETWORK, STORAGE & SECURITY POSTURE", "text": "`android:usesCleartextTraffic` is absent or `false`; `network_security_config.xml` sets `cleartextTrafficPermitted=\"false\"` for all domains.", "sev": "blocker", "auto": true, "attest": false, "domain": "security", "fix": "res/xml/network_security_config.xml:\n  <network-security-config>\n    <base-config cleartextTrafficPermitted=\"false\"/>\n  </network-security-config>\nand android:networkSecurityConfig=\"@xml/network_security_config\".\n", "refs": [], "scanner": true}, {"id": "NET-002", "section": "SECTION 5 — NETWORK, STORAGE & SECURITY POSTURE", "text": "No `http://` endpoints in Dart, Kotlin, Java, or config files (excluding schema/namespace URIs and localhost in debug flavours only).", "sev": "blocker", "auto": true, "attest": false, "domain": "security", "fix": "", "refs": [], "scanner": true}, {"id": "NET-003", "section": "SECTION 5 — NETWORK, STORAGE & SECURITY POSTURE", "text": "No custom `TrustManager`/`HostnameVerifier` that accepts all certs; no `badCertificateCallback => true` in Dart `HttpClient`.", "sev": "blocker", "auto": true, "attest": false, "domain": "security", "fix": "", "refs": [], "scanner": true}, {"id": "NET-004", "section": "SECTION 5 — NETWORK, STORAGE & SECURITY POSTURE", "text": "No API keys, secrets, JWT signing keys, Razorpay/Stripe secret keys, or Firebase admin credentials in the repo, in `strings.xml`, or in the Dart bundle. Scan with the bundled secret detector.", "sev": "high", "auto": true, "attest": false, "domain": "security", "fix": "", "refs": [], "scanner": true}, {"id": "NET-005", "section": "SECTION 5 — NETWORK, STORAGE & SECURITY POSTURE", "text": "Sensitive local storage uses `flutter_secure_storage`/EncryptedSharedPreferences — never plain `shared_preferences` for tokens, phone numbers, or payment data.", "sev": "high", "auto": true, "attest": false, "domain": "security", "fix": "", "refs": [], "scanner": true}, {"id": "NET-006", "section": "SECTION 5 — NETWORK, STORAGE & SECURITY POSTURE", "text": "`android:allowBackup=\"false\"` and `android:dataExtractionRules` configured so tokens/PII are excluded from cloud backup.", "sev": "high", "auto": true, "attest": false, "domain": "security", "fix": "", "refs": [], "scanner": true}, {"id": "NET-007", "section": "SECTION 5 — NETWORK, STORAGE & SECURITY POSTURE", "text": "`android:debuggable` absent in release; no `Log.d`/`print`/`debugPrint` of PII, OTPs, or tokens in release builds (strip via `dart-define` + a lint rule).", "sev": "high", "auto": true, "attest": false, "domain": "security", "fix": "", "refs": [], "scanner": true}, {"id": "NET-008", "section": "SECTION 5 — NETWORK, STORAGE & SECURITY POSTURE", "text": "`FLAG_SECURE` set on OTP, payment, and KYC screens to block screenshots/screen recording.", "sev": "medium", "auto": true, "attest": false, "domain": "security", "fix": "", "refs": [], "scanner": true}, {"id": "NET-009", "section": "SECTION 5 — NETWORK, STORAGE & SECURITY POSTURE", "text": "Exported components: every `<activity>/<service>/<receiver>/<provider>` with an intent filter has explicit `android:exported` and is genuinely safe to export.", "sev": "medium", "auto": true, "attest": false, "domain": "security", "fix": "", "refs": [], "scanner": true}, {"id": "NET-010", "section": "SECTION 5 — NETWORK, STORAGE & SECURITY POSTURE", "text": "Deep links use **App Links with verified `assetlinks.json`** (autoVerify), not bare custom schemes that any app can hijack.", "sev": "medium", "auto": true, "attest": false, "domain": "security", "fix": "", "refs": [], "scanner": true}, {"id": "NET-011", "section": "SECTION 5 — NETWORK, STORAGE & SECURITY POSTURE", "text": "No dynamic code loading, no downloading executable code/DEX/JS-that-changes-behaviour at runtime, no self-update mechanism outside Play (Device & Network Abuse policy).", "sev": "high", "auto": true, "attest": false, "domain": "security", "fix": "", "refs": ["Play Device and Network Abuse policy"], "scanner": true}, {"id": "NET-012", "section": "SECTION 5 — NETWORK, STORAGE & SECURITY POSTURE", "text": "WebViews: `setJavaScriptEnabled` only where needed, no `addJavascriptInterface` to untrusted content, `setAllowFileAccess(false)`.", "sev": "medium", "auto": true, "attest": false, "domain": "security", "fix": "", "refs": [], "scanner": true}, {"id": "NET-013", "section": "SECTION 5 — NETWORK, STORAGE & SECURITY POSTURE", "text": "Play Integrity API used for anti-abuse rather than root/emulator hacks that read device identifiers.", "sev": "medium", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "NET-014", "section": "SECTION 5 — NETWORK, STORAGE & SECURITY POSTURE", "text": "Certificate pinning implemented with a documented rotation plan (pinning without rotation is an outage risk, not a compliance one).", "sev": "low", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "NET-015", "section": "SECTION 5 — NETWORK, STORAGE & SECURITY POSTURE", "text": "Dependency vulnerability scan clean of known-vulnerable SDK versions Google actively enforces against (Play flags these in the Console's App Bundle Explorer / SDK index).", "sev": "high", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "SDK-001", "section": "SECTION 6 — THIRD-PARTY SDKs & SUPPLY CHAIN", "text": "Full SDK inventory generated from `pubspec.lock` + `app/build.gradle` + merged manifest, with owner, purpose, data collected, and Play SDK Index status for each.", "sev": "blocker", "auto": true, "attest": false, "domain": "sdk", "fix": "", "refs": [], "scanner": true}, {"id": "SDK-002", "section": "SECTION 6 — THIRD-PARTY SDKs & SUPPLY CHAIN", "text": "No SDK on Play's \"known policy-violating / deprecated\" list; no SDK version flagged in the Play SDK Index.", "sev": "blocker", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "SDK-003", "section": "SECTION 6 — THIRD-PARTY SDKs & SUPPLY CHAIN", "text": "No analytics/attribution/crash SDK auto-initialises **before** consent. Disable auto-init (`firebase_analytics_collection_enabled=false`, `google_analytics_default_allow_ad_personalization_signals=false`, AppsFlyer/Branch manual start) and enable only post-consent.", "sev": "blocker", "auto": true, "attest": false, "domain": "sdk", "fix": "", "refs": [], "scanner": true}, {"id": "SDK-004", "section": "SECTION 6 — THIRD-PARTY SDKs & SUPPLY CHAIN", "text": "Each SDK's own Data Safety mapping merged into your declaration.", "sev": "high", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "SDK-005", "section": "SECTION 6 — THIRD-PARTY SDKs & SUPPLY CHAIN", "text": "Contractual: no SDK sells personal/sensitive data; DPAs signed with each processor.", "sev": "high", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "SDK-006", "section": "SECTION 6 — THIRD-PARTY SDKs & SUPPLY CHAIN", "text": "No SDK that reads installed-app lists, clipboard on launch, SMS, or accessibility events.", "sev": "high", "auto": true, "attest": false, "domain": "sdk", "fix": "", "refs": [], "scanner": true}, {"id": "SDK-007", "section": "SECTION 6 — THIRD-PARTY SDKs & SUPPLY CHAIN", "text": "Ads (if any): Google **UMP/CMP consent** for EEA/UK, `AD_ID` declared, ad content rating matches app rating, no ads on splash/interstitials that block core flows, no ads in a Families-designated app without Families-approved SDKs.", "sev": "medium", "auto": true, "attest": false, "domain": "sdk", "fix": "", "refs": [], "scanner": true}, {"id": "SDK-008", "section": "SECTION 6 — THIRD-PARTY SDKs & SUPPLY CHAIN", "text": "Payment SDKs (Razorpay/PhonePe/Paytm/UPI intent): use official SDKs, current versions, no deprecated collect-flow patterns.", "sev": "medium", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "SDK-009", "section": "SECTION 6 — THIRD-PARTY SDKs & SUPPLY CHAIN", "text": "**Third-party AI/LLM integrations** — the July 2026 User Data clarification makes you responsible for what any AI SDK does with user data. Disclose prompt/content transmission if you send user data to a model provider.", "sev": "medium", "auto": false, "attest": true, "domain": "sdk", "fix": "", "refs": ["Play policy clarification, 15 July 2026 — User Data policy and third-party AI integrations"], "scanner": true}, {"id": "SDK-010", "section": "SECTION 6 — THIRD-PARTY SDKs & SUPPLY CHAIN", "text": "SBOM emitted per release and archived with the build artefact.", "sev": "low", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PAY-001", "section": "SECTION 7 — PAYMENTS, BILLING & MONETISATION", "text": "Classify every purchase: **digital goods/services ⇒ Google Play Billing mandatory**; **physical goods/services ⇒ must NOT use Play Billing**. Misclassification is a suspension vector both ways.", "sev": "blocker", "auto": false, "attest": true, "domain": "payments", "fix": "List every SKU in compliance_config.yaml under purchases: with\ntype: digital|physical. Digital ⇒ Google Play Billing mandatory.\nPhysical ⇒ Play Billing must NOT be used.\n", "refs": [], "scanner": true}, {"id": "PAY-002", "section": "SECTION 7 — PAYMENTS, BILLING & MONETISATION", "text": "If digital: `com.android.vending.BILLING` present, Play Billing Library on a currently-supported version, purchases acknowledged within 3 days, server-side receipt verification.", "sev": "blocker", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PAY-003", "section": "SECTION 7 — PAYMENTS, BILLING & MONETISATION", "text": "No in-app steering to external payment for digital goods — no \"pay on our website\", no web-view checkout, no UPI deep link for digital items (outside the approved **India alternative billing** programme).", "sev": "blocker", "auto": true, "attest": false, "domain": "payments", "fix": "", "refs": [], "scanner": true}, {"id": "PAY-004", "section": "SECTION 7 — PAYMENTS, BILLING & MONETISATION", "text": "If using **India alternative billing**, you are enrolled in the programme, the required user-choice UI is shown, and reporting/service-fee obligations are met.", "sev": "high", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PAY-005", "section": "SECTION 7 — PAYMENTS, BILLING & MONETISATION", "text": "No peer-to-peer money transfer, no gambling/real-money-gaming mechanics, no lottery/contest with entry fee unless separately licensed and permitted in-region.", "sev": "blocker", "auto": true, "attest": false, "domain": "payments", "fix": "", "refs": [], "scanner": true}, {"id": "PAY-006", "section": "SECTION 7 — PAYMENTS, BILLING & MONETISATION", "text": "Subscriptions: price, billing period, free-trial terms, and cancellation path disclosed **before** purchase and in the store listing; auto-renew clearly stated.", "sev": "high", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PAY-007", "section": "SECTION 7 — PAYMENTS, BILLING & MONETISATION", "text": "Refund/cancellation policy in-app and honoured; no dark patterns in cancellation.", "sev": "high", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "PAY-008", "section": "SECTION 7 — PAYMENTS, BILLING & MONETISATION", "text": "**Financial features declaration** completed in Play Console if Pyaas offers payments, wallets, lending, or investments. India personal-loan/EWA apps have extra declarations and document proof.", "sev": "high", "auto": false, "attest": true, "domain": "payments", "fix": "", "refs": [], "scanner": true}, {"id": "PAY-009", "section": "SECTION 7 — PAYMENTS, BILLING & MONETISATION", "text": "No PIN/CVV/full-PAN capture in your own UI; tokenisation via the PSP. No card data touching your servers or logs.", "sev": "blocker", "auto": true, "attest": false, "domain": "payments", "fix": "", "refs": [], "scanner": true}, {"id": "PAY-010", "section": "SECTION 7 — PAYMENTS, BILLING & MONETISATION", "text": "Wallet balances, fees, and FX (if any) disclosed; no hidden charges.", "sev": "medium", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "STORE-001", "section": "SECTION 8 — STORE LISTING, METADATA & CONTENT", "text": "**Content rating (IARC) questionnaire completed and accurate.** Unrated apps may be removed — the July 2026 clarification restates that unrated apps are prohibited. Re-answer it whenever features change (chat, UGC, payments, ads).", "sev": "blocker", "auto": false, "attest": true, "domain": "store", "fix": "", "refs": ["Play policy clarification, 15 July 2026 — unrated apps prohibited"], "scanner": true}, {"id": "STORE-002", "section": "SECTION 8 — STORE LISTING, METADATA & CONTENT", "text": "Store listing describes only features that exist and are reachable. Every permission is justified by a described feature.", "sev": "blocker", "auto": false, "attest": true, "domain": "store", "fix": "", "refs": [], "scanner": true}, {"id": "STORE-003", "section": "SECTION 8 — STORE LISTING, METADATA & CONTENT", "text": "Screenshots/video reflect the actual current UI, no mockups of unshipped features, no device frames with fake ratings, no \"editor's choice\"/award claims.", "sev": "high", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "STORE-004", "section": "SECTION 8 — STORE LISTING, METADATA & CONTENT", "text": "Title ≤30 chars, no keyword stuffing, no \"#1\", \"Best\", \"Free\" promotional text in title/icon/screenshots.", "sev": "high", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "STORE-005", "section": "SECTION 8 — STORE LISTING, METADATA & CONTENT", "text": "Icon does not imitate Google/Android/other brands; no misleading badges.", "sev": "high", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "STORE-006", "section": "SECTION 8 — STORE LISTING, METADATA & CONTENT", "text": "**Target audience & content** declaration accurate. If not child-directed, ensure nothing in design/marketing appeals primarily to children (Families policy is strict-liability-ish).", "sev": "high", "auto": false, "attest": true, "domain": "store", "fix": "", "refs": [], "scanner": true}, {"id": "STORE-007", "section": "SECTION 8 — STORE LISTING, METADATA & CONTENT", "text": "Ads declaration (\"Contains ads\") set correctly.", "sev": "high", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "STORE-008", "section": "SECTION 8 — STORE LISTING, METADATA & CONTENT", "text": "App category, tags, and contact details accurate; support email monitored.", "sev": "medium", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "STORE-009", "section": "SECTION 8 — STORE LISTING, METADATA & CONTENT", "text": "No incentivised-review prompts, no rating gating (\"rate 5★ to unlock\").", "sev": "medium", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "STORE-010", "section": "SECTION 8 — STORE LISTING, METADATA & CONTENT", "text": "UGC (if any): reporting/blocking, moderation, and a published content policy — required by User Generated Content policy.", "sev": "medium", "auto": false, "attest": true, "domain": "store", "fix": "", "refs": [], "scanner": true}, {"id": "STORE-011", "section": "SECTION 8 — STORE LISTING, METADATA & CONTENT", "text": "If any AI generates user-visible content: in-app reporting for offensive AI output, documented safety testing (Generative AI policy).", "sev": "medium", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "STORE-012", "section": "SECTION 8 — STORE LISTING, METADATA & CONTENT", "text": "Localised listings accurate, not machine-translated nonsense.", "sev": "low", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "REL-001", "section": "SECTION 9 — BUILD, RELEASE & TECHNICAL GATES", "text": "**`targetSdkVersion` ≥ 36 (Android 16)** for new apps and updates from **31 Aug 2026**. Existing apps must be ≥35 to stay discoverable to all users. Extension to 1 Nov 2026 is requestable from the Policy Status page.", "sev": "blocker", "auto": true, "attest": false, "domain": "release", "fix": "android { compileSdk = 36; defaultConfig { targetSdk = 36 } }\nTest edge-to-edge enforcement, predictive back, and Android 16 behaviour changes.\nAn extension to 1 Nov 2026 can be requested from Play Console → Policy status.\n", "refs": ["https://support.google.com/googleplay/android-developer/answer/11926878"], "scanner": true}, {"id": "REL-002", "section": "SECTION 9 — BUILD, RELEASE & TECHNICAL GATES", "text": "`compileSdkVersion` ≥ 36; AGP ≥ 8.5.1 (also gives 16 KB zip alignment); Gradle/JDK matched.", "sev": "blocker", "auto": true, "attest": false, "domain": "release", "fix": "", "refs": [], "scanner": true}, {"id": "REL-003", "section": "SECTION 9 — BUILD, RELEASE & TECHNICAL GATES", "text": "**16 KB page-size support** for all bundled `.so` files. Mandatory for updates from **1 Feb 2027** for apps targeting API 35+. Flutter ships native libs — verify with `zipalign -c -P 16 -v 4` and `check_elf_alignment.sh`. Bump Flutter/NDK (r28+) and any native plugins.", "sev": "high", "auto": true, "attest": false, "domain": "release", "fix": "zipalign -c -P 16 -v 4 build/app/outputs/bundle/release/app-release.aab\nbundletool dump config --bundle=app-release.aab | grep alignment  # PAGE_ALIGNMENT_16K\nUpgrade AGP >= 8.5.1, NDK >= r28, and any native Flutter plugins.\n", "refs": ["https://developer.android.com/guide/practices/page-sizes — required for updates from 1 Feb 2027"], "scanner": true}, {"id": "REL-004", "section": "SECTION 9 — BUILD, RELEASE & TECHNICAL GATES", "text": "**versionCode incremented** above the suspended build. Play will reject a re-upload otherwise.", "sev": "blocker", "auto": true, "attest": false, "domain": "release", "fix": "", "refs": [], "scanner": true}, {"id": "REL-005", "section": "SECTION 9 — BUILD, RELEASE & TECHNICAL GATES", "text": "Non-compliant version moved to **\"Not included\"** in every track (Production, Open, Closed, Internal) and deactivated.", "sev": "blocker", "auto": false, "attest": true, "domain": "", "fix": "", "refs": [], "scanner": false}, {"id": "REL-006", "section": "SECTION 9 — BUILD, RELEASE & TECHNICAL GATES", "text": "App Bundle (`.aab`) with Play App Signing enrolled; upload key secured; keystore backed up offline.", "sev": "blocker", "auto": true, "attest": false, "domain": "release", "fix": "", "refs": [], "scanner": true}, {"id": "REL-007", "section": "SECTION 9 — BUILD, RELEASE & TECHNICAL GATES", "text": "ProGuard/R8 rules do not strip consent-gate classes; obfuscation mapping uploaded for crash de-obfuscation.", "sev": "high", "auto": true, "attest": false, "domain": "release", "fix": "", "refs": [], "scanner": true}, {"id": "REL-008", "section": "SECTION 9 — BUILD, RELEASE & TECHNICAL GATES", "text": "Release build has no debug flavours, no test endpoints, no `flutter_driver`, no `--enable-vm-service`.", "sev": "high", "auto": true, "attest": false, "domain": "release", "fix": "", "refs": [], "scanner": true}, {"id": "REL-009", "section": "SECTION 9 — BUILD, RELEASE & TECHNICAL GATES", "text": "No `android:extractNativeLibs=\"true\"` regressions; `useLegacyPackaging` false.", "sev": "high", "auto": true, "attest": false, "domain": "", "fix": "", "refs": [], let checked = new Set(["INC-001", "INC-002", "INC-003", "INC-004", "INC-005", "INC-006", "INC-007", "INC-008", "INC-009", "INC-010", "INC-011", "INC-012", "INC-013", "PD-001", "PD-002", "PD-003", "PD-005", "PD-007", "PD-008", "PD-009", "PD-100", "PD-101", "PD-102", "PD-103", "PD-104", "PD-105", "PD-106", "PD-107", "PD-108", "PD-109", "PD-110", "PERM-001", "PERM-002", "PERM-003", "PERM-004", "PERM-005", "PERM-006", "PERM-007", "PERM-008", "PERM-009", "PERM-010", "PERM-011", "PERM-012", "PERM-013", "PERM-014", "PERM-015", "PERM-016", "PERM-017", "PERM-018", "PERM-019", "PERM-020", "PERM-021", "PERM-022", "PERM-023", "PERM-024", "DS-006", "LEG-001", "LEG-002", "LEG-003", "LEG-004", "LEG-011", "LEG-015", "LEG-017", "LEG-018", "NET-001", "NET-002", "NET-003", "NET-005", "NET-006", "NET-007", "NET-009", "NET-011", "NET-012", "NET-013", "NET-015", "SDK-001", "SDK-002", "SDK-003", "SDK-004", "SDK-005", "SDK-006", "SDK-007", "SDK-008", "SDK-009", "SDK-010", "PAY-001", "PAY-002", "PAY-003", "PAY-004", "PAY-005", "PAY-006", "PAY-007", "PAY-009", "PAY-010", "REL-001", "REL-002", "REL-003", "REL-004", "REL-007", "REL-008", "REL-009", "ACC-001", "ACC-002", "ACC-003", "FAM-001", "FAM-003", "FAM-004", "OPS-001"]);
let expanded = false;

const el = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const secSel = el('#fsec');
[...new Set(ITEMS.map(i=>i.section))].forEach(s=>{
  const o=document.createElement('option'); o.value=s; o.textContent=s.replace(/^SECTION \d+ — /,''); secSel.append(o);
});

function visible(){
  const q=el('#q').value.toLowerCase(), sec=el('#fsec').value, sev=el('#fsev').value,
        st=el('#fst').value, kind=el('#fkind').value;
  return ITEMS.filter(i=>{
    if(sec && i.section!==sec) return false;
    if(sev && i.sev!==sev) return false;
    if(st==='done' && !checked.has(i.id)) return false;
    if(st==='open' && checked.has(i.id)) return false;
    if(kind==='auto' && !i.scanner) return false;
    if(kind==='attest' && !i.attest) return false;
    if(q && !(i.id+' '+i.text+' '+i.domain+' '+i.fix).toLowerCase().includes(q)) return false;
    return true;
  });
}

function render(){
  const list=el('#list'); list.innerHTML='';
  const vis=visible();
  if(!vis.length){ list.innerHTML='<div class="empty">No checks match these filters.</div>'; }
  let cur=null;
  vis.forEach(i=>{
    if(i.section!==cur){ cur=i.section;
      const h=document.createElement('h2'); h.textContent=cur; list.append(h); }
    const done=checked.has(i.id);
    const d=document.createElement('div');
    d.className='item '+i.sev+(done?' done':'');
    d.innerHTML=`
      <input class="cb" type="checkbox" ${done?'checked':''} data-id="${i.id}">
      <div class="body">
        <div class="idrow">
          <span class="id">${i.id}</span>
          <span class="tag sev">${i.sev}</span>
          ${i.domain?`<span class="tag">${esc(i.domain)}</span>`:''}
          ${i.scanner?'<span class="tag auto">scanner-enforced</span>':''}
          ${i.attest?'<span class="tag">human sign-off</span>':''}
        </div>
        <div class="txt">${i.text}</div>
        ${(i.fix||i.refs.length)?`<details ${expanded?'open':''}>
           <summary>How to fix</summary>
           ${i.fix?`<pre>${esc(i.fix.trim())}</pre>`:''}
           ${i.refs.length?`<div class="refs">${i.refs.map(r=>r.startsWith('http')
              ?`<a href="${esc(r)}" target="_blank" rel="noopener">${esc(r)}</a>`
              :`<span class="note">${esc(r)}</span>`).join('')}</div>`:''}
         </details>`:''}
      </div>`;
    list.append(d);
  });
  list.querySelectorAll('.cb').forEach(cb=>cb.onchange=e=>{
    const id=e.target.dataset.id;
    e.target.checked?checked.add(id):checked.delete(id);
    render();
  });
  stats();
}

function stats(){
  const n=s=>ITEMS.filter(i=>i.sev===s).length;
  const open=s=>ITEMS.filter(i=>i.sev===s&&!checked.has(i.id)).length;
  const pct=Math.round(checked.size/ITEMS.length*100);
  el('#kpis').innerHTML=[
    ['blockers open',open('blocker')+' / '+n('blocker')],
    ['high open',open('high')+' / '+n('high')],
    ['medium open',open('medium')+' / '+n('medium')],
    ['complete',pct+'%'],
    ['submit-ready',(open('blocker')===0&&open('high')===0)?'YES':'NO'],
  ].map(([k,v])=>`<div class="kpi"><b>${v}</b><span>${k}</span></div>`).join('');
  el('#bar').style.width=pct+'%';
}

['#q','#fsec','#fsev','#fst','#fkind'].forEach(s=>{
  el(s).addEventListener('input',render); el(s).addEventListener('change',render);
});
el('#expand').onclick=()=>{expanded=!expanded; el('#expand').textContent=expanded?'Collapse fixes':'Expand fixes'; render();};
el('#reset').onclick=()=>{checked=new Set(); render();};
el('#save').onclick=()=>{
  el('#io').open=true;
  el('#iobox').value=JSON.stringify({checked:[...checked],saved:new Date().toISOString()},null,1);
  el('#iobox').select();
};
el('#load').onclick=()=>{
  try{ checked=new Set(JSON.parse(el('#iobox').value).checked||[]); render(); }
  catch(e){ alert('Could not parse that JSON.'); }
};
render();
</script></body></html>
