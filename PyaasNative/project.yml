name: Pyaas
options:
  bundleIdPrefix: in.pyaasdairy
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO

targets:
  Pyaas:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.pyaasdairy.consumer
        PRODUCT_NAME: PYAAS
        PRODUCT_MODULE_NAME: PYAAS
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: targeted
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: ""
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    configFiles:
      Debug: Config/Pyaas.xcconfig
      Release: Config/Pyaas.xcconfig

  PyaasTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.pyaasdairy.consumer.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PYAAS.app/PYAAS
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Pyaas

schemes:
  Pyaas:
    build:
      targets:
        Pyaas: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PyaasTests
